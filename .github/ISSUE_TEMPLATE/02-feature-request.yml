name: "✨ 功能建议"
description: "希望新增的功能或改进"
title: "[Feature] 简短的特性描述"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        🌐 **中英双语提交均可** — Issues and communication in both Chinese and English are welcome.
        感谢你的建议！请描述你想要的功能和使用场景。
  - type: input
    id: openwrt_version
    attributes:
      label: "🖥️ OpenWrt 版本号"
      description: "你正在使用的固件版本（不确定填『未知』）"
      placeholder: "例如：R2026-08-08 或 未知"
    validations:
      required: true
  - type: input
    id: luci_version
    attributes:
      label: "🧩 LuCI 版本号"
      description: "LuCI 版本（不确定填『未知』）"
      placeholder: "例如：git-25.123.45678-abcdefg 或 未知"
    validations:
      required: true
  - type: input
    id: firmware_source
    attributes:
      label: "📦 固件仓库来源（可选）"
      description: "固件来源：官方发行版填版本（如 OpenWrt 23.05 / immortalwrt 24.10）；自编译请填 OpenWrt 源码仓库（如 github.com/coolsnowwolf/lede）"
      placeholder: "例如：immortalwrt 24.10 或 源码仓库 https://github.com/xxx/op"
    validations:
      required: false
  - type: input
    id: plugin_version
    attributes:
      label: "🔌 插件版本"
      description: "当前 pushbot 版本（标题卡片角标可见）"
      placeholder: "例如：v5.13-r3"
    validations:
      required: true
  - type: textarea
    id: feature_description
    attributes:
      label: "💡 功能描述"
      description: "想要什么功能？解决了什么痛点？"
      placeholder: "描述功能需求和使用场景…"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "🖼️ 参考截图/链接（可选）"
      description: "参考实现、示意图等"
      placeholder: "拖拽图片或粘贴链接…"
    validations:
      required: false
